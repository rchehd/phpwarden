name: Sandbox

on:
  workflow_dispatch:
    inputs:
      drupal:
        description: Drupal version for application jobs
        type: choice
        options: [all, "10", "11"]
        default: all
      installation:
        description: PHPWarden installation methods for Drupal application jobs
        type: choice
        options: [all, standalone, composer, npm, compose]
        default: all
      environment:
        description: Application environment or independent Docker-less CLI smoke
        type: choice
        options: [all, compose, ddev, docker, host, dockerless]
        default: all

permissions:
  contents: read

jobs:
  dockerless:
    name: Docker-less · CLI installation and recorded profiles
    if: inputs.environment == 'all' || inputs.environment == 'dockerless'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Exercise offline installer and native readers without Docker or PHP
        run: python3 tools/sandbox/dockerless.py --output "$RUNNER_TEMP/phpwarden-sandbox-dockerless"
      - name: Upload Docker-less evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phpwarden-sandbox-dockerless-${{ github.sha }}
          path: |
            ${{ runner.temp }}/phpwarden-sandbox-dockerless/*.json
            ${{ runner.temp }}/phpwarden-sandbox-dockerless/*.txt
            ${{ runner.temp }}/phpwarden-sandbox-dockerless/logs/
          if-no-files-found: warn
          retention-days: 7

  drupal:
    name: Drupal ${{ matrix.drupal }} · ${{ matrix.environment }} · acceptance
    if: inputs.environment != 'dockerless'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        drupal: ${{ fromJSON(inputs.drupal == '10' && '["10"]' || inputs.drupal == '11' && '["11"]' || '["10","11"]') }}
        environment: ${{ fromJSON(inputs.environment == 'compose' && '["compose"]' || inputs.environment == 'ddev' && '["ddev"]' || inputs.environment == 'docker' && '["docker"]' || inputs.environment == 'host' && '["host"]' || '["compose","ddev","docker","host"]') }}
    steps:
      - name: Validate sandbox selection
        env:
          DRUPAL_SELECTION: ${{ inputs.drupal }}
          ENVIRONMENT_SELECTION: ${{ inputs.environment }}
        run: |
          case "$DRUPAL_SELECTION" in
            all|10|11) ;;
            *) echo "Select all, 10 or 11." >&2; exit 1 ;;
          esac
          case "$ENVIRONMENT_SELECTION" in
            all|compose|ddev|docker|host) ;;
            *) echo "Select all, compose, ddev, docker or host." >&2; exit 1 ;;
          esac
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "22.22.3"
      - uses: shivammathur/setup-php@v2
        if: matrix.environment == 'host'
        with:
          php-version: "8.3"
          extensions: ctype, curl, dom, fileinfo, filter, gd, iconv, intl, mbstring, openssl, pdo, pdo_sqlite, phar, simplexml, sqlite3, tokenizer, xml, xmlreader, xmlwriter, zlib
          coverage: none
          tools: none
      - name: Install pinned DDEV tools
        if: matrix.environment == 'ddev'
        run: |
          sh tools/sandbox/install-ddev.sh "$RUNNER_TEMP/phpwarden-ddev/bin"
          echo "$RUNNER_TEMP/phpwarden-ddev/bin" >> "$GITHUB_PATH"
      - name: Build matching PHP 8.3 worker
        run: |
          export PHPWARDEN_VERSION="v0.0.0-dev.${GITHUB_SHA::7}"
          export PHPWARDEN_COMMIT="$GITHUB_SHA"
          docker buildx bake php83
      - name: Install and exercise Drupal sandbox
        env:
          DRUPAL_MAJOR: ${{ matrix.drupal }}
          INSTALLATION: ${{ inputs.installation }}
          SANDBOX_ENVIRONMENT: ${{ matrix.environment }}
        run: python3 tools/sandbox/run.py --drupal "$DRUPAL_MAJOR" --environment "$SANDBOX_ENVIRONMENT" --installation "$INSTALLATION" --output "$RUNNER_TEMP/phpwarden-sandbox-drupal$DRUPAL_MAJOR-$SANDBOX_ENVIRONMENT"
      - name: Upload sandbox evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phpwarden-sandbox-drupal${{ matrix.drupal }}-${{ matrix.environment }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/phpwarden-sandbox-drupal${{ matrix.drupal }}-${{ matrix.environment }}/summary.json
            ${{ runner.temp }}/phpwarden-sandbox-drupal${{ matrix.drupal }}-${{ matrix.environment }}/captures.json
            ${{ runner.temp }}/phpwarden-sandbox-drupal${{ matrix.drupal }}-${{ matrix.environment }}/mcp-transcript.json
            ${{ runner.temp }}/phpwarden-sandbox-drupal${{ matrix.drupal }}-${{ matrix.environment }}/docker-launch.json
            ${{ runner.temp }}/phpwarden-sandbox-drupal${{ matrix.drupal }}-${{ matrix.environment }}/logs/
          if-no-files-found: warn
          retention-days: 7
