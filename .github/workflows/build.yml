name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: What to build after checks pass
        type: choice
        options: [all, cli, images, plugins]
        default: all
      publish_images:
        description: Publish tested development images to GHCR (main, images/all only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate build request
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Validate target and publication settings
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          BUILD_TARGET: ${{ inputs.target }}
          PUBLISH_IMAGES: ${{ inputs.publish_images }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            case "$BUILD_TARGET" in
              all|cli|images|plugins) ;;
              *) echo "Build target must be all, cli, images, or plugins." >&2; exit 1 ;;
            esac
            if [ "$PUBLISH_IMAGES" = true ]; then
              if [[ "$BUILD_TARGET" != images && "$BUILD_TARGET" != all ]]; then
                echo "Image publication requires the images or all target." >&2
                exit 1
              fi
              if [[ "$REF_NAME" != main || "$REF_TYPE" != branch ]]; then
                echo "Manual publication requires the main branch. Other refs can be built and tested without publication." >&2
                exit 1
              fi
            fi
          fi
          if [ "$REF_TYPE" = tag ] && [[ ! "$REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "Build tags must use vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-prerelease." >&2
            exit 1
          fi
          if [ "$REF_TYPE" = tag ] && [[ "$REF_NAME" == *-* ]]; then
            IFS='.' read -r -a identifiers <<< "${REF_NAME#*-}"
            for identifier in "${identifiers[@]}"; do
              if [[ "$identifier" =~ ^0[0-9]+$ ]]; then
                echo "Numeric prerelease identifiers cannot start with zero." >&2
                exit 1
              fi
            done
          fi

  checks:
    name: Checks before build
    needs: validate
    uses: ./.github/workflows/ci.yml

  docker:
    name: Docker images · build, test, publish
    if: github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'images'
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "22.22.3"
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install pinned DDEV tools
        run: |
          sh tools/sandbox/install-ddev.sh "$RUNNER_TEMP/phpwarden-ddev/bin"
          echo "$RUNNER_TEMP/phpwarden-ddev/bin" >> "$GITHUB_PATH"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: ctype, curl, dom, fileinfo, filter, gd, iconv, intl, mbstring, openssl, pdo, pdo_sqlite, phar, simplexml, sqlite3, tokenizer, xml, xmlreader, xmlwriter, zlib
          coverage: none
          tools: none
      - name: Build development worker images
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          export PHPWARDEN_VERSION="v0.0.0-dev.${GITHUB_SHA::7}"
          if [ "$REF_TYPE" = tag ]; then export PHPWARDEN_VERSION="$REF_NAME"; fi
          export PHPWARDEN_COMMIT="$GITHUB_SHA"
          docker buildx bake
      - name: Run real Docker fixture tests
        run: |
          for runtime in 8.1 8.2 8.3 8.4; do
            PHPWARDEN_TEST_IMAGE="phpwarden:static-php$runtime-dev" python -m unittest tests.acceptance.docker_worker -v
          done
      - name: Run public launcher fixture tests
        run: python -m unittest tests.acceptance.launcher_cli -v
      - name: Run Compose installation and hook tests
        env:
          PHPWARDEN_TEST_IMAGE: phpwarden:static-php8.3-dev
        run: python -m unittest tests.acceptance.compose_cli -v
      - name: Run installed Drupal 10 and 11 sandboxes in Compose, DDEV, Docker and host PHP
        run: |
          for environment in compose ddev docker host; do
            for major in 10 11; do
              python3 tools/sandbox/run.py --drupal "$major" --environment "$environment" --output "$RUNNER_TEMP/phpwarden-sandbox-drupal$major-$environment"
            done
          done
      - name: Summarize installed sandbox scenarios
        if: always()
        run: python3 tools/sandbox/report.py "$RUNNER_TEMP"/phpwarden-sandbox-drupal* --output "$GITHUB_STEP_SUMMARY"
      - name: Upload sandbox evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phpwarden-build-sandboxes-${{ github.sha }}
          path: |
            ${{ runner.temp }}/phpwarden-sandbox-drupal*/summary.json
            ${{ runner.temp }}/phpwarden-sandbox-drupal*/captures.json
            ${{ runner.temp }}/phpwarden-sandbox-drupal*/mcp-transcript.json
            ${{ runner.temp }}/phpwarden-sandbox-drupal*/docker-launch.json
            ${{ runner.temp }}/phpwarden-sandbox-drupal*/logs/
            ${{ runner.temp }}/phpwarden-sandbox-drupal*/evidence/
          if-no-files-found: warn
          retention-days: 7
      - name: Publish tested images
        if: (github.event_name == 'push' && github.ref_type == 'tag') || (github.event_name == 'workflow_dispatch' && inputs.publish_images)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          for runtime in 8.1 8.2 8.3 8.4; do
            tags=("static-php$runtime-dev-${GITHUB_SHA::7}")
            if [ "$REF_TYPE" = tag ]; then
              tags+=("static-php$runtime-$REF_NAME")
            else
              tags+=("static-php$runtime-dev")
            fi
            for tag in "${tags[@]}"; do
              docker tag "phpwarden:static-php$runtime-dev" "$repository:$tag"
              docker push "$repository:$tag"
            done
          done
          mkdir -p published
          version="v0.0.0-dev.${GITHUB_SHA::7}"
          if [ "$REF_TYPE" = tag ]; then version="$REF_NAME"; fi
          python3 tools/distribution.py manifest --version "$version" --repository "$repository" --output published/compatibility.json
      - name: Upload published worker compatibility manifest
        if: (github.event_name == 'push' && github.ref_type == 'tag') || (github.event_name == 'workflow_dispatch' && inputs.publish_images)
        uses: actions/upload-artifact@v7
        with:
          name: phpwarden-worker-manifest-${{ github.sha }}
          path: published/compatibility.json
          if-no-files-found: error

  cli-build:
    name: CLI · downloadable Linux amd64 build
    if: >-
      always() && needs.checks.result == 'success' &&
      (github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'cli') &&
      (needs.docker.result == 'success' || (needs.docker.result == 'skipped' && inputs.target == 'cli'))
    needs: [checks, docker]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Download matching published worker manifest
        if: github.event_name == 'push' || inputs.publish_images
        uses: actions/download-artifact@v8
        with:
          name: phpwarden-worker-manifest-${{ github.sha }}
          path: published
      - name: Build and package standalone CLI
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="v0.0.0-dev.${GITHUB_SHA::7}"
          if [ "$REF_TYPE" = tag ]; then version="$REF_NAME"; fi
          manifest=()
          if [ -f published/compatibility.json ]; then manifest=(--manifest published/compatibility.json); fi
          python3 tools/distribution.py package --version "$version" --commit "$GITHUB_SHA" "${manifest[@]}" --output dist
      - name: Exercise the packaged CLI without Docker or PHP
        run: python3 tools/sandbox/dockerless.py --archive "$GITHUB_WORKSPACE/dist/phpwarden-linux-amd64.tar.gz" --output "$RUNNER_TEMP/phpwarden-build-dockerless"
      - name: Summarize packaged CLI scenarios
        if: always()
        run: python3 tools/sandbox/report.py "$RUNNER_TEMP/phpwarden-build-dockerless" --output "$GITHUB_STEP_SUMMARY"
      - name: Upload Docker-less evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phpwarden-build-dockerless-${{ github.sha }}
          path: |
            ${{ runner.temp }}/phpwarden-build-dockerless/*.json
            ${{ runner.temp }}/phpwarden-build-dockerless/*.txt
            ${{ runner.temp }}/phpwarden-build-dockerless/logs/
            ${{ runner.temp }}/phpwarden-build-dockerless/evidence/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload CLI archive and checksum
        uses: actions/upload-artifact@v7
        with:
          name: phpwarden-linux-amd64-${{ github.sha }}
          path: |
            dist/phpwarden-linux-amd64.tar.gz
            dist/SHA256SUMS
            dist/compatibility.json
            dist/phpwarden-composer-linux-amd64.zip
            dist/phpwarden-npm-linux-amd64.tgz
            dist/phpwarden-compose-php*.tar.gz
            dist/install.sh
          if-no-files-found: error

  agent-plugins:
    name: Agent plugins · package skills and catalogs
    if: github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'plugins'
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Package versioned agent skills
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="v0.0.0-dev.${GITHUB_SHA::7}"
          if [ "$REF_TYPE" = tag ]; then version="$REF_NAME"; fi
          go run ./cmd/phpwarden-dist plugins --version "$version" --commit "$GITHUB_SHA" --output agent-plugins
          cd agent-plugins
          sha256sum -c SHA256SUMS
      - name: Upload plugin archives and catalogs
        uses: actions/upload-artifact@v7
        with:
          name: phpwarden-agent-plugins-${{ github.sha }}
          path: agent-plugins/
          if-no-files-found: error

  release:
    name: Publish versioned release assets
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [docker, cli-build, agent-plugins]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: phpwarden-linux-amd64-${{ github.sha }}
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: phpwarden-agent-plugins-${{ github.sha }}
          path: agent-plugins
      - name: Assemble verified release assets
        run: |
          (cd agent-plugins && sha256sum -c SHA256SUMS)
          (cd dist && sha256sum -c SHA256SUMS)
          cp agent-plugins/phpwarden-plugin-*.zip dist/
          cat agent-plugins/SHA256SUMS >> dist/SHA256SUMS
          (cd dist && sha256sum -c SHA256SUMS)
      - name: Publish archive, checksum and compatibility manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum -c SHA256SUMS
          prerelease=()
          if [[ "$RELEASE_TAG" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$RELEASE_TAG" phpwarden-linux-amd64.tar.gz SHA256SUMS compatibility.json phpwarden-composer-linux-amd64.zip phpwarden-npm-linux-amd64.tgz phpwarden-compose-php*.tar.gz phpwarden-plugin-*.zip install.sh --verify-tag --title "$RELEASE_TAG" --generate-notes "${prerelease[@]}"

