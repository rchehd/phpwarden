name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: What to build after checks pass
        type: choice
        options: [all, cli, images]
        default: all
      publish_images:
        description: Publish tested development images to GHCR (main, images/all only)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate build request
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Validate target and publication settings
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          BUILD_TARGET: ${{ inputs.target }}
          PUBLISH_IMAGES: ${{ inputs.publish_images }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            case "$BUILD_TARGET" in
              all|cli|images) ;;
              *) echo "Build target must be all, cli, or images." >&2; exit 1 ;;
            esac
            if [ "$PUBLISH_IMAGES" = true ]; then
              if [ "$BUILD_TARGET" = cli ]; then
                echo "Image publication requires the images or all target." >&2
                exit 1
              fi
              if [[ "$REF_NAME" != main || "$REF_TYPE" != branch ]]; then
                echo "Manual publication requires the main branch. Other refs can be built and tested without publication." >&2
                exit 1
              fi
            fi
          fi
          if [ "$REF_TYPE" = tag ] && [[ ! "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Build tags must use vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-prerelease." >&2
            exit 1
          fi

  checks:
    name: Checks before build
    needs: validate
    uses: ./.github/workflows/ci.yml

  docker:
    name: Docker images · build, test, publish
    if: github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'images'
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build development worker images
        run: docker buildx bake
      - name: Run real Docker fixture tests
        run: |
          for runtime in 8.1 8.2 8.3 8.4; do
            PHPWARDEN_TEST_IMAGE="phpwarden:static-php$runtime-dev" python -m unittest tests.acceptance.docker_worker -v
          done
      - name: Run public launcher fixture tests
        run: python -m unittest tests.acceptance.launcher_cli -v
      - name: Publish tested images
        if: (github.event_name == 'push' && github.ref_type == 'tag') || (github.event_name == 'workflow_dispatch' && inputs.publish_images)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          for runtime in 8.1 8.2 8.3 8.4; do
            tags=("static-php$runtime-dev-${GITHUB_SHA::7}")
            if [ "$REF_TYPE" = tag ]; then
              tags+=("static-php$runtime-$REF_NAME")
            else
              tags+=("static-php$runtime-dev")
            fi
            for tag in "${tags[@]}"; do
              docker tag "phpwarden:static-php$runtime-dev" "$repository:$tag"
              docker push "$repository:$tag"
            done
          done

  cli-build:
    name: CLI · downloadable Linux amd64 build
    if: github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'cli'
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Build and package standalone CLI
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o dist/phpwarden ./cmd/phpwarden
          dist/phpwarden --version
          cp README.md dist/README.md
          git rev-parse HEAD > dist/COMMIT
          tar -czf dist/phpwarden-linux-amd64.tar.gz -C dist phpwarden README.md COMMIT
          cd dist
          sha256sum phpwarden-linux-amd64.tar.gz > SHA256SUMS
      - name: Upload CLI archive and checksum
        uses: actions/upload-artifact@v7
        with:
          name: phpwarden-linux-amd64-${{ github.sha }}
          path: |
            dist/phpwarden-linux-amd64.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error

