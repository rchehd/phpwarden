name: Repository checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-fixtures:
    name: Test infrastructure and Git fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install development checker
        run: python -m pip install -r requirements-dev.txt
      - name: Lint test infrastructure
        run: python -m ruff check tests
      - name: Check test infrastructure formatting
        run: python -m ruff format --check tests
      - name: Validate Git scenarios and expectations
        run: python -m unittest discover -s tests -v
