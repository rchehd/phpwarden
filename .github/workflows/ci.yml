name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_images:
        description: Publish tested development images to GHCR (main only)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  docker:
    name: Docker images · build, test, publish
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref_type == 'tag')
    needs: [go, test-fixtures]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Validate image publication target
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          PUBLISH_IMAGES: ${{ inputs.publish_images }}
        run: |
          if [[ "$EVENT_NAME" = workflow_dispatch && "$PUBLISH_IMAGES" = true && ( "$REF_NAME" != main || "$REF_TYPE" != branch ) ]]; then
            echo "Manual publication requires the main branch. Other refs can be built and tested without publication." >&2
            exit 1
          fi
          if [ "$REF_TYPE" = tag ] && [[ ! "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Image tags must use vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-prerelease." >&2
            exit 1
          fi
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build development worker images
        run: docker buildx bake
      - name: Run real Docker fixture tests
        run: |
          for runtime in 8.1 8.2 8.3 8.4; do
            PHPWARDEN_TEST_IMAGE="phpwarden:static-php$runtime-dev" python -m unittest tests.acceptance.docker_worker -v
          done
      - name: Run public launcher fixture tests
        run: python -m unittest tests.acceptance.launcher_cli -v
      - name: Publish tested images
        if: (github.event_name == 'push' && github.ref_type == 'tag') || (github.event_name == 'workflow_dispatch' && inputs.publish_images)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          for runtime in 8.1 8.2 8.3 8.4; do
            tags=("static-php$runtime-dev-${GITHUB_SHA::7}")
            if [ "$REF_TYPE" = tag ]; then
              tags+=("static-php$runtime-$REF_NAME")
            else
              tags+=("static-php$runtime-dev")
            fi
            for tag in "${tags[@]}"; do
              docker tag "phpwarden:static-php$runtime-dev" "$repository:$tag"
              docker push "$repository:$tag"
            done
          done

  cli-build:
    name: CLI · downloadable Linux amd64 build
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref_type == 'tag')
    needs: [go, test-fixtures]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Build and package standalone CLI
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o dist/phpwarden ./cmd/phpwarden
          dist/phpwarden --version
          cp README.md dist/README.md
          git rev-parse HEAD > dist/COMMIT
          tar -czf dist/phpwarden-linux-amd64.tar.gz -C dist phpwarden README.md COMMIT
          cd dist
          sha256sum phpwarden-linux-amd64.tar.gz > SHA256SUMS
      - name: Upload CLI archive and checksum
        uses: actions/upload-artifact@v7
        with:
          name: phpwarden-linux-amd64-${{ github.sha }}
          path: |
            dist/phpwarden-linux-amd64.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error

  go:
    name: Go · lint and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: tokenizer, mbstring, simplexml, xmlwriter
          coverage: none
          tools: composer:2.10.3
      - name: Install locked YAML tool dependencies for native worker tests
        run: composer install --working-dir tools/yaml --no-dev --no-plugins --no-scripts --prefer-dist --no-interaction
      - name: Install locked PHPCS tool dependencies for native worker tests
        run: composer install --working-dir tools/phpcs --no-dev --no-plugins --no-scripts --prefer-dist --no-interaction
      - name: Install locked PHPStan tool dependencies for native worker tests
        run: composer install --working-dir tools/phpstan --no-dev --no-plugins --no-scripts --prefer-dist --no-interaction
      - name: Install locked Twig CS Fixer tool dependencies for native worker tests
        run: composer install --working-dir tools/twig-cs-fixer --no-dev --no-plugins --no-scripts --prefer-dist --no-interaction
      - name: Install locked Composer tool dependencies for native worker tests
        run: composer install --working-dir tools/composer --no-dev --no-plugins --no-scripts --prefer-dist --no-interaction
      - name: Install locked package dependency and syntax tool bundles
        run: |
          for directory in composer-require-checker/php8.4 composer-unused parallel-lint; do
            composer install --working-dir "tools/$directory" --no-dev --no-plugins --no-scripts --prefer-dist --no-interaction
          done
      - name: Install locked Deptrac tool dependencies for native worker tests
        run: composer install --working-dir tools/deptrac --no-dev --no-plugins --no-scripts --prefer-dist --no-interaction
      - name: Install locked Drupal Rector tool dependencies for native worker tests
        run: composer install --working-dir tools/rector --no-dev --no-plugins --no-scripts --prefer-dist --no-interaction
      - name: Install locked PHPMD tool dependencies for native worker tests
        run: composer install --working-dir tools/phpmd --no-dev --no-plugins --no-scripts --prefer-dist --no-interaction
      - uses: actions/setup-node@v6
        with:
          node-version: "22.22.3"
      - name: Install locked Node tool dependencies
        run: npm ci --prefix tools/node --ignore-scripts --no-audit --no-fund
      - name: Prepare pinned EventHorizon API bundle
        run: python3 tools/eventhorizon/prepare.py
      - name: Prepare pinned Semgrep CE bundle
        run: python3 tools/semgrep/prepare.py
      - name: Install pinned Gitleaks for native worker tests
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Check Node helper syntax
        run: node --check internal/checker/nodecheck/helper.cjs
      - name: Check formatting
        run: |
          files=$(gofmt -l cmd internal schemas)
          if [ -n "$files" ]; then
            printf '%s\n' "$files"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Unit and CLI acceptance tests
        run: go test -race ./...
      - name: Build standalone CLI
        run: CGO_ENABLED=0 go build -trimpath -o /tmp/phpwarden ./cmd/phpwarden
      - name: Lint PHP helper
        run: |
          php -l internal/checker/packagecheck/helper.php
          php -l internal/checker/syntax/parallel.php
          php -l internal/checker/deptrac/helper.php
          php -l internal/checker/rector/helper.php
          php -l internal/checker/rector/config.php
          php -l internal/checker/debug/helper.php
          php -l internal/checker/yaml/helper.php
          php -l internal/checker/phpcs/helper.php
          php -l internal/checker/phpstan/helper.php
          php -l internal/checker/twigcsfixer/helper.php
          php -l internal/checker/composervalidate/helper.php
      - name: Worker fixture acceptance tests
        run: python -m unittest tests.acceptance.worker_cli -v

  test-fixtures:
    name: Test fixtures · lint and validate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install development checker
        run: python -m pip install -r requirements-dev.txt
      - name: Lint Python infrastructure
        run: python -m ruff check tests internal/checker/eventhorizon/helper.py tools/eventhorizon/prepare.py tools/semgrep/prepare.py
      - name: Check Python infrastructure formatting
        run: python -m ruff format --check tests internal/checker/eventhorizon/helper.py tools/eventhorizon/prepare.py tools/semgrep/prepare.py
      - name: Validate Git scenarios and expectations
        run: python -m unittest discover -s tests -v
