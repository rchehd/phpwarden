name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker:
    name: Docker images · build, test, publish
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build development worker images
        run: docker buildx bake
      - name: Run real Docker fixture tests
        run: |
          for runtime in 8.1 8.2 8.3 8.4; do
            PHPWARDEN_TEST_IMAGE="phpwarden:static-php$runtime-dev" python -m unittest tests.acceptance.docker_worker -v
          done
      - name: Run public launcher fixture tests
        run: python -m unittest tests.acceptance.launcher_cli -v
      - name: Publish tested images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          for runtime in 8.1 8.2 8.3 8.4; do
            for tag in "static-php$runtime-dev" "static-php$runtime-dev-${GITHUB_SHA::7}"; do
              docker tag "phpwarden:static-php$runtime-dev" "$repository:$tag"
              docker push "$repository:$tag"
            done
          done

  go:
    name: Go · lint and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: tokenizer, mbstring, simplexml, xmlwriter
          coverage: none
          tools: composer:2.10.3
      - name: Install locked YAML tool dependencies for native worker tests
        run: composer install --working-dir tools/yaml --no-dev --no-plugins --no-scripts --prefer-dist --no-interaction
      - name: Install locked PHPCS tool dependencies for native worker tests
        run: composer install --working-dir tools/phpcs --no-dev --no-plugins --no-scripts --prefer-dist --no-interaction
      - name: Install locked PHPStan tool dependencies for native worker tests
        run: composer install --working-dir tools/phpstan --no-dev --no-plugins --no-scripts --prefer-dist --no-interaction
      - name: Install locked Twig CS Fixer tool dependencies for native worker tests
        run: composer install --working-dir tools/twig-cs-fixer --no-dev --no-plugins --no-scripts --prefer-dist --no-interaction
      - name: Install locked Composer tool dependencies for native worker tests
        run: composer install --working-dir tools/composer --no-dev --no-plugins --no-scripts --prefer-dist --no-interaction
      - name: Check formatting
        run: |
          files=$(gofmt -l cmd internal schemas)
          if [ -n "$files" ]; then
            printf '%s\n' "$files"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Unit and CLI acceptance tests
        run: go test -race ./...
      - name: Build standalone CLI
        run: CGO_ENABLED=0 go build -trimpath -o /tmp/phpwarden ./cmd/phpwarden
      - name: Lint PHP helper
        run: |
          php -l internal/checker/debug/helper.php
          php -l internal/checker/yaml/helper.php
          php -l internal/checker/phpcs/helper.php
          php -l internal/checker/phpstan/helper.php
          php -l internal/checker/twigcsfixer/helper.php
          php -l internal/checker/composervalidate/helper.php
      - name: Worker fixture acceptance tests
        run: python -m unittest tests.acceptance.worker_cli -v

  test-fixtures:
    name: Test fixtures · lint and validate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install development checker
        run: python -m pip install -r requirements-dev.txt
      - name: Lint test infrastructure
        run: python -m ruff check tests
      - name: Check test infrastructure formatting
        run: python -m ruff format --check tests
      - name: Validate Git scenarios and expectations
        run: python -m unittest discover -s tests -v
