version: 1
profile: drupal
composer_root: "."  # directory with composer.json, for example "platform" in a monorepo
framework:
  version: auto
php:
  runtime: "8.4"
  target:
    min: "8.4"
    max: "8.4"
scope:
  mode: diff
  base: origin/main
tools:
  composer-validate:
    enabled: true
    required: true
    fail_on: error
    strict: false
  composer-audit:
    enabled: true
    required: false
    fail_on: error
    max_age_hours: 24
    max_stale_hours: 168
    ignore: []
  phpstan:
    enabled: true
    required: true
    fail_on: error
    discover_config: true
    autoload: auto
    drupal: true
    deprecations: true
  twig-cs-fixer:
    enabled: true
    required: true
    fail_on: error
    discover_config: true
  phpcs:
    enabled: true
    required: true
    fail_on: error
    discover_config: true
    standards: [Drupal, DrupalPractice]
    compatibility:
      enabled: false
  phpmd:
    enabled: true
    required: true
    fail_on: error
    discover_config: true
    rulesets: [unusedcode, codesize]
    exclude_rules: [UnusedFormalParameter]
  drupal-config:
    enabled: true
    required: true
    fail_on: error
    directories: [config/install, config/optional, config/schema]
    forbidden_keys: [uuid, _core]
    module_roots: []
  whitespace:
    enabled: true
    required: true
    fail_on: error
    trailing_whitespace: true
    conflict_markers: true
    trailing_whitespace_exclude: ["**/*.md", "**/*.patch", "**/*.diff"]
    conflict_markers_exclude: []
  yaml:
    enabled: true
    required: true
    fail_on: error
  syntax:
    enabled: true
    required: true
    fail_on: error
  debug:
    enabled: true
    required: true
    fail_on: error
    # Lists replace the profile defaults.
    js_functions: [console.log, console.debug, console.trace, console.dir]
    twig_functions: [dump, kint]
