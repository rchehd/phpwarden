version: 1
profile: drupal
framework:
  version: auto
php:
  runtime: "8.4"
  target:
    min: "8.4"
    max: "8.4"
scope:
  mode: diff
  base: origin/main
tools:
  whitespace:
    enabled: true
    required: true
    fail_on: error
    trailing_whitespace: true
    conflict_markers: true
    trailing_whitespace_exclude: ["**/*.md", "**/*.patch", "**/*.diff"]
    conflict_markers_exclude: []
  yaml:
    enabled: true
    required: true
    fail_on: error
  syntax:
    enabled: true
    required: true
    fail_on: error
  debug:
    enabled: true
    required: true
    fail_on: error
