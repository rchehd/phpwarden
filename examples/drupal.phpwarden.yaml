version: 1
profile: drupal
composer_root: "."  # directory with composer.json, for example "platform" in a monorepo
framework:
  version: auto
php:
  runtime: "8.4"
  target:
    min: "8.4"
    max: "8.4"
scope:
  mode: diff
  base: origin/main
runner:
  result_cache: false
tools:
  composer-validate:
    enabled: true
    required: true
    fail_on: error
    strict: false
  composer-audit:
    enabled: true
    required: false
    fail_on: error
    max_age_hours: 24
    max_stale_hours: 168
    ignore: []
  phpstan:
    enabled: true
    required: true
    fail_on: error
    discover_config: true
    autoload: auto
    drupal: true
    deprecations: true
    strict_rules:
      enabled: false
      all: true
      rules: {}
  twig-cs-fixer:
    autoload: ""  # use auto for project configs that load Drupal token parsers
    enabled: true
    required: true
    fail_on: error
    discover_config: true
  phpcs:
    enabled: true
    required: true
    fail_on: error
    discover_config: true
    standards: [Drupal, DrupalPractice]
    compatibility:
      enabled: false
  dead-code:
    enabled: true
    fail_on: error
  eventhorizon:
    enabled: true
    required: true
    fail_on: never
    caching: true
    config_sync: []
    exclude_rules: []
  composer-require-checker:
    enabled: false
    fail_on: never
    composer_root: ""
    config: ""
    discover_config: true
    scan_files: []
    allowed_symbols: []
    extra_inputs: []
    memory_limit_mb: 1024
  composer-unused:
    enabled: false
    fail_on: never
    composer_root: ""
    config: ""
    discover_config: true
    exclude_packages: []
    exclude_directories: []
    extra_inputs: []
    memory_limit_mb: 1024
  deptrac:
    enabled: true
    required: true
    fail_on: error
    timeout_seconds: 300
    config: ""
    discover_config: true
    extra_inputs: []
    report_uncovered: false
    fail_on_uncovered: false
    report_skipped: false
    memory_limit_mb: 1024
    exclude: []
  # When enabled, use upstream sets for the current Drupal version unless overridden.
  rector:
    enabled: true
    required: true
    fail_on: never
    timeout_seconds: 600
    config: ""
    discover_config: true
    target_php: ""
    target_drupal: ""
    sets: []
    rules: []
    skip_rules: []
    extra_inputs: []
    extra_extensions: []
    dry_run: true
    memory_limit_mb: 1024
    exclude: []
  semgrep:
    enabled: true
    required: true
    fail_on: error
    discover_config: true
    use_defaults: true
    rulesets: []
    rules: []
    exclude_rules: []
    severities: [ERROR, WARNING, INFO]
    baseline: ""
    rule_timeout_seconds: 5
    memory_limit_mb: 1024
  eslint:
    enabled: true
    fail_on: error
    discover_config: true
  stylelint:
    enabled: true
    fail_on: error
    discover_config: true
  jscpd:
    enabled: true
    fail_on: error
    min_tokens: 70
    min_lines: 6
    mode: mild
  gitleaks:
    enabled: true
    required: true
    fail_on: error
    discover_config: true
    rules: []
    extra_inputs: []
  phpmd:
    enabled: true
    required: true
    fail_on: error
    discover_config: true
    rulesets: [unusedcode, codesize]
    exclude_rules: [UnusedFormalParameter]
  drupal-config:
    enabled: true
    required: true
    fail_on: error
    directories: [config/install, config/optional, config/schema]
    forbidden_keys: [uuid, _core]
    module_roots: []
  whitespace:
    enabled: true
    required: true
    fail_on: error
    trailing_whitespace: true
    conflict_markers: true
    trailing_whitespace_exclude: ["**/*.md", "**/*.patch", "**/*.diff"]
    conflict_markers_exclude: []
  yaml:
    enabled: true
    required: true
    fail_on: error
  syntax:
    backend: php
    parallel_jobs: 4
    enabled: true
    required: true
    fail_on: error
  debug:
    enabled: true
    required: true
    fail_on: error
    # Lists replace the profile defaults.
    js_functions: [console.log, console.debug, console.trace, console.dir]
    twig_functions: [dump, kint]
